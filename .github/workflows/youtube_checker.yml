name: YouTube New Video Checker

on:
#  schedule:
#    # 每 10 分鐘自動執行一次 (格式: 分 時 日 月 週)
#    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點按鈕觸發測試

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 21 環境
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 下載 PostgreSQL JDBC Driver
        run: |
          curl -sL https://jdbc.postgresql.org/download/postgresql-42.7.2.jar -o postgresql.jar

      - name: 編譯 Java 程式
        run: |
          mkdir -p bin
          javac -cp postgresql.jar -d bin src/main/java/com/liu/YoutubeNotifier.java

      - name: 執行檢查程式
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          java -cp bin:postgresql.jar com.liu.YoutubeNotifier